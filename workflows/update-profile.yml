name: Auto Update Profile README

on:
  schedule:
    # Runs every day at 11:59 PM UTC
    - cron: '59 23 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Fetch today's commits
        id: commits
        run: python .github/scripts/fetch_commits.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      
      - name: Update README
        run: python .github/scripts/update_readme.py
        env:
          COMMIT_COUNT: ${{ steps.commits.outputs.commit_count }}
          ACTIVE_REPO: ${{ steps.commits.outputs.active_repo }}
          COMMIT_MESSAGES: ${{ steps.commits.outputs.commit_messages }}
      
      - name: Commit changes
        run: |
          git config --local user.email "satish19.devops@gmail.com"
          git config --local user.name "Satish Shukla"
          git add README.md
          git commit -m "🤖 Auto-update: Daily commit statistics" || echo "No changes to commit"
          git push
